name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev \
            libvulkan-dev libva-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Optimized Release Binary
        run: cargo build --release --workspace

      - name: Package Release Assets
        run: |
          mkdir -p dist/pkg
          cp target/release/fluxcut dist/pkg/
          cp install.sh dist/pkg/
          cp README.md dist/pkg/
          cp LICENSE dist/pkg/
          cp -r resources dist/pkg/
          cp org.fluxcut.FluxCut.yaml dist/pkg/
          
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          tar -czf "dist/fluxcut-${TAG}-linux-x86_64.tar.gz" -C dist/pkg .
          cp "dist/fluxcut-${TAG}-linux-x86_64.tar.gz" dist/fluxcut-linux-x86_64.tar.gz
          
          cd dist
          sha256sum fluxcut-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/fluxcut-*.tar.gz
            dist/SHA256SUMS
          name: FluxCut ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
