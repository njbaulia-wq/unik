name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            libvulkan-dev libva-dev libasound2-dev ffmpeg

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Optimized Release Binary
        run: cargo build --release --workspace

      - name: Package Release Assets
        run: |
          mkdir -p dist/pkg
          cp target/release/fluxcut dist/pkg/
          cp install.sh dist/pkg/
          cp README.md dist/pkg/
          cp LICENSE dist/pkg/
          cp -r resources dist/pkg/
          cp org.fluxcut.FluxCut.yaml dist/pkg/
          
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          tar -czf "dist/fluxcut-${TAG}-linux-x86_64.tar.gz" -C dist/pkg .
          cp "dist/fluxcut-${TAG}-linux-x86_64.tar.gz" dist/fluxcut-linux-x86_64.tar.gz
          
          cd dist
          sha256sum fluxcut-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/fluxcut-*.tar.gz
            dist/SHA256SUMS
          name: FluxCut ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-fedora-release:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Optimized Fedora Binary via Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace fedora:latest bash -c "
            set -e
            dnf install -y --setopt=install_weak_deps=False gcc pkgconf-pkg-config gtk4-devel libadwaita-devel ffmpeg-free-devel alsa-lib-devel clang rust cargo git
            cd /workspace
            cargo build --release --workspace --target-dir /workspace/target-fedora
          "

      - name: Package Fedora Release Assets
        run: |
          mkdir -p dist/pkg-fedora
          cp target-fedora/release/fluxcut dist/pkg-fedora/
          cp install.sh dist/pkg-fedora/
          cp README.md dist/pkg-fedora/
          cp LICENSE dist/pkg-fedora/
          cp -r resources dist/pkg-fedora/
          cp org.fluxcut.FluxCut.yaml dist/pkg-fedora/

          TAG="${GITHUB_REF_NAME:-v0.1.1}"
          tar -czf "dist/fluxcut-${TAG}-fedora-x86_64.tar.gz" -C dist/pkg-fedora .
          cp "dist/fluxcut-${TAG}-fedora-x86_64.tar.gz" dist/fluxcut-fedora-x86_64.tar.gz

      - name: Upload Fedora Assets to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/fluxcut*fedora*.tar.gz

